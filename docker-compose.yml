services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: uc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  trip-db:
    image: mysql:8.4
    container_name: uc-trip-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: uc-trip
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - trip-db-data:/var/lib/mysql

  trip-service:
    build: ./services/trip-service
    container_name: uc-trip-service
    working_dir: /var/www/html
    # Not `artisan serve`: ServeCommand passes only its $passthroughVariables
    # whitelist to the PHP server child process, so DB_HOST/KAFKA_BROKERS below
    # never reach HTTP requests and the app falls back to .env. This runs the
    # same router script serve uses, but inherits the whole environment.
    command: sh -c "cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8002:8000"
    volumes:
      - ./services/trip-service:/var/www/html
    environment:
      # Container view of the other services. Real env vars beat .env in
      # Laravel, so these override the host values in .env.
      DB_HOST: trip-db
      DB_PORT: 3306
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
      - trip-db

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

volumes:
  trip-db-data:
